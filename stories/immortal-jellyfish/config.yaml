# One surprising animal fact. Upbeat voice; big yellow captions.
project:
  aspect: "9:16"
  style: "luminous digital illustration, translucent glowing jellyfish, deep midnight blue water, soft pink and cyan light, clean shapes, single centered subject, simple background"
  negative_prompt: "text, letters, words, numbers, labels, watermark, signature, border, frame, repeating pattern, collage, diagram, photo, blurry"
speech:
  voice: af_heart
  speed: 1.03
timing:
  pad_start_s: 0.1
  pad_end_s: 0.3
  min_scene_s: 1.3
subtitles:
  rules: {max_lines: 2, max_gap_s: 0.5, min_cue_s: 0.5, max_cue_s: 2.5}
  style: {font_size_ratio: 0.085, margin_bottom_ratio: 0.26, outline_px: 7, uppercase: true, primary_color: "#FFE14D"}
planning:
  min_scene_words: 3
  max_scene_words: 22
# Fewer drawing steps than the default 30: about a fifth less time per picture.
provider_options:
  sdxl: {steps: 24}
