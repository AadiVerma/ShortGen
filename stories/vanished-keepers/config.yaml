# True unsolved mystery. Slow, low voice; moody stills.
project:
  aspect: "9:16"
  style: "moody ink and watercolor illustration, muted teal and grey palette, storm light, dramatic clouds, film grain"
  negative_prompt: "text, letters, words, watermark, signature, border, frame, people, faces, bright colors, cartoon, blurry"
speech:
  voice: bm_lewis
  speed: 0.93
timing:
  pad_start_s: 0.2
  pad_end_s: 0.55
  min_scene_s: 1.5
subtitles:
  rules: {max_lines: 2, max_gap_s: 0.5, min_cue_s: 0.6, max_cue_s: 3.0}
  style: {font_size_ratio: 0.07, margin_bottom_ratio: 0.24, outline_px: 6}
planning:
  min_scene_words: 3
  max_scene_words: 22
# Fewer drawing steps than the default 30: about a fifth less time per picture.
provider_options:
  sdxl: {steps: 24}
