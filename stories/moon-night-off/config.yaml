# Original bedtime story for young children. Warm, unhurried voice; big easy captions.
project:
  aspect: "9:16"
  # Says how to paint and that it is night. It must not mention the sky: that put a moon
  # into scenes where the moon is asleep.
  style: "cute 3D animated cartoon, rounded shapes, cozy night, soft warm glow, simple background"
  negative_prompt: "text, letters, words, numbers, watermark, signature, border, frame, repeating pattern, collage, realistic, photorealistic, scary, creepy, sharp teeth, red eyes, people, faces, child, photo, blurry, deformed"
speech:
  voice: af_heart      # the voice model's best-rated voice
  speed: 0.95
timing:
  pad_start_s: 0.2
  pad_end_s: 0.55
  min_scene_s: 1.8
subtitles:
  rules: {max_lines: 2, max_gap_s: 0.5, min_cue_s: 0.7, max_cue_s: 3.0}
  style: {font_size_ratio: 0.085, margin_bottom_ratio: 0.26, outline_px: 8, primary_color: "#FFE14D"}
planning:
  min_scene_words: 3
  max_scene_words: 22
# Fewer drawing steps than the default 30: about a fifth less time per picture.
provider_options:
  sdxl: {steps: 24}
