[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shortgen"
version = "0.1.0"
description = "A local, free, open-source pipeline that turns a short story or script into a narrated, captioned, short-form vertical video from a single command."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["video", "text-to-video", "tts", "subtitles", "ffmpeg", "local-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "psutil>=5.9",
    "pillow>=10.1",  # rasterises captions, so ffmpeg needs no libass/freetype
]

[project.optional-dependencies]
speech = ["kokoro-onnx>=0.6", "numpy>=2.0"]
# The PyTorch build of Kokoro supports Python 3.10-3.12 only.
speech-torch = ["kokoro>=0.9.4; python_version < '3.13'", "numpy>=1.26"]
whisper = ["faster-whisper>=1.1"]
mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
image = [
    "torch>=2.4",
    "diffusers>=0.35",
    "transformers>=4.44",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "huggingface-hub>=0.25",
]
video = ["shortgen[image]", "ftfy>=6.2"]
mcp = ["mcp>=2.0,<3"]
# Optional and never a default: adapters for Higgsfield, a hosted, paid service.
hosted = ["higgsfield-client>=0.2,<0.3"]
local = ["shortgen[speech,image]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-psutil",
    "numpy>=1.26",  # only for the Kokoro adapter's stand-in test
    "higgsfield-client>=0.2,<0.3",  # only to test the hosted adapters against a mock server
]

[project.scripts]
shortgen = "shortgen.cli:cli"
shortgen-mcp = "shortgen.mcp_server:main"

[project.urls]
Homepage = "https://github.com/AadiVerma/ShortGen"
Issues = "https://github.com/AadiVerma/ShortGen/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/shortgen"]

# Ship the default YAML files inside the wheel; in a source checkout they are
# read from ./configs directly (see shortgen.config.default_config_dir).
[tool.hatch.build.targets.wheel.force-include]
"configs" = "shortgen/_configs"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "C90", "PTH", "RUF", "S", "T20"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
# Stand-alone tools: long report lines and calling ffmpeg from PATH are fine here.
"scripts/**" = ["E501", "S603", "S607", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
# Abstract provider interfaces are passed as type tokens (ProviderHandle.get).
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "diffusers.*",
    "transformers.*",
    "kokoro.*",
    "kokoro_onnx.*",
    "numpy.*",
    "PIL.*",
    "faster_whisper.*",
    "mlx_whisper.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["ffmpeg: needs the ffmpeg and ffprobe binaries (skipped when they are missing)"]

[tool.coverage.run]
source = ["shortgen"]
