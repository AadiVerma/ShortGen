# Format: vertical scary storytime. Slow, low voice; dark cinematic stills.
project:
  aspect: "9:16"
  style: "dark cinematic illustration, moonlit blue shadows, film grain, single dim light source, eerie quiet atmosphere, muted desaturated palette"
  negative_prompt: "text, watermark, gore, blood, bright colors, cartoon"
planning:
  min_scene_words: 3
  max_scene_words: 18
speech:
  voice: am_onyx
  speed: 0.92
timing:
  pad_start_s: 0.25
  pad_end_s: 0.6
  min_scene_s: 1.5
subtitles:
  rules: {max_lines: 2, max_gap_s: 0.5, min_cue_s: 0.6, max_cue_s: 3.0}
  style: {font_size_ratio: 0.07, margin_bottom_ratio: 0.24, outline_px: 6}
